name: github pages
on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: Create .nojekyll
        run: echo '' > .nojekyll
      - name: Install Dart Sass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release view --repo sass/dart-sass --json tagName -q .tagName)
          curl -sSLO "https://github.com/sass/dart-sass/releases/download/${VERSION}/dart-sass-${VERSION}-linux-x64.tar.gz"
          tar -xzf "dart-sass-${VERSION}-linux-x64.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/dart-sass/sass" --version
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --minify
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./public
